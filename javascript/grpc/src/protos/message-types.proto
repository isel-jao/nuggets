// =========================
//  PrimitiveTypes
// =========================
message PrimitiveTypes {
  double   double_field   = 1;
  float    float_field    = 2;
  int32    int32_field    = 3;
  int64    int64_field    = 4;
  uint32   uint32_field   = 5;
  uint64   uint64_field   = 6;
  sint32   sint32_field   = 7;
  sint64   sint64_field   = 8;
  fixed32  fixed32_field  = 9;
  fixed64  fixed64_field  = 10;
  sfixed32 sfixed32_field = 11;
  sfixed64 sfixed64_field = 12;
  bool     bool_field     = 13;
  string   string_field   = 14;
  bytes    bytes_field    = 15;
}

// =========================
// enum
// =========================
enum Status {
  UNKNOWN  = 0;
  ACTIVE   = 1;
  INACTIVE = 2;
}

// =========================
// nested message
// =========================
message OuterMessage {
  string content = 1;
}

message NestedMessage {
  string content = 1;
  message InnerMessage {
    string content = 1;
  }
  InnerMessage inner_message = 2;
  OuterMessage outer_message = 3;
}

// =========================
// repeated fields
// =========================
message RepeatedFields {
  repeated int32         repeated_int32_field   = 1;
  repeated string        repeated_string_field  = 2;
  repeated Status        repeated_enum_field    = 3;
  repeated NestedMessage repeated_message_field = 4;
}

// =========================
// map fields
// =========================
message MapFields {
  map<string, int32>         map_string_int32_field   = 1;
  map<string, string>        map_string_string_field  = 2;
  map<string, Status>        map_string_enum_field    = 3;
  map<string, NestedMessage> map_string_message_field = 4;
}

// =========================
// oneof fields
// =========================
message OneofFields {
  oneof test_oneof {
    int32         oneof_int32_field   = 1;
    string        oneof_string_field  = 2;
    Status        oneof_enum_field    = 3;
    NestedMessage oneof_message_field = 4;
  }
}

// =========================
// reserved fields
// =========================
message ReservedFields {
  reserved 2, 4 to 6;
  reserved "old_field_name", "another_old_field_name";
  int32 new_field = 1;
}

// =========================
// extensions
// =========================
message ExtendedMessage {
  extensions 100 to 199;
}

// =========================
// extension fields
// =========================
extend ExtendedMessage {
  int32 extended_field = 100;
}
